name: q3-opt200-routescan
on:
  push:
    branches: [q3-opt-200]
    paths:
      - 'tools/q3_bench_routescan.py'
      - '.github/workflows/q3_opt200_routescan.yml'
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: |
          python q3/bench/sim_payload.py
          python q3/bench/jammers_offline_sim.py selftest
      - name: Route-scan screen
        env:
          Q3_BENCH_K: '2'
          Q3_WORKERS: '7'
        run: python tools/q3_bench_routescan.py
