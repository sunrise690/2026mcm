name: q3-opt200-v3
on:
  push:
    branches: [q3-opt-200]
    paths:
      - 'tools/q3_bench_trigger_v3.txt'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: |
          python q3/bench/sim_payload.py
          python q3/bench/jammers_offline_sim.py selftest
      - name: Screen generation 2
        env:
          Q3_BENCH_K: '2'
          Q3_WORKERS: '7'
        run: python tools/q3_bench_v2.py
