name: q3-farprobe-validate
on:
  push:
    branches: [q3-opt-200]
    paths:
      - 'tools/q3_farprobe_validate.py'
      - '.github/workflows/q3_farprobe_validate.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python q3/bench/sim_payload.py
      - run: python tools/q3_farprobe_validate.py
