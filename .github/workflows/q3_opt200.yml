name: q3-opt200
on:
  push:
    branches: [q3-opt-200]
    paths:
      - 'q3/**'
      - '.github/workflows/q3_opt200.yml'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore exact offline simulator
        run: |
          python q3/bench/sim_payload.py
          python q3/bench/jammers_offline_sim.py selftest
      - name: Screen candidates
        env:
          Q3_BENCH_K: '2'
          Q3_WORKERS: '7'
        run: python q3/bench/bench_candidates.py
